<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meus gastos</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#d9ece6;--surface:rgba(255,255,255,.42);--ink:#14211f;--muted:#4a5f5a;--line:rgba(20,33,31,.14);--glass:rgba(255,255,255,.75);--accent:#0f4c45;--accent-ink:#fff;--hot:#e4572e;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1412;--surface:rgba(255,255,255,.07);--ink:#e8f0ed;--muted:#9fb3ae;--line:rgba(255,255,255,.14);--glass:rgba(255,255,255,.2);--accent:#5fc4b3;--accent-ink:#06201c;--hot:#ff8a65;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1412;--surface:rgba(255,255,255,.07);--ink:#e8f0ed;--muted:#9fb3ae;--line:rgba(255,255,255,.14);--glass:rgba(255,255,255,.2);--accent:#5fc4b3;--accent-ink:#06201c;--hot:#ff8a65;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(42vmax 42vmax at 10% 6%,rgba(20,184,160,.55),transparent 62%),radial-gradient(38vmax 38vmax at 92% 18%,rgba(255,138,101,.5),transparent 62%),radial-gradient(46vmax 46vmax at 72% 96%,rgba(100,120,255,.42),transparent 62%)}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:28px 18px 56px}
.total,.bars,form,#lista,input[type=month],.auth-bar{background:var(--surface);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--glass);border-radius:22px;box-shadow:0 10px 36px rgba(10,30,28,.12),inset 0 1px 0 var(--glass)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.header-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:1.1rem;font-weight:600;margin:0}
input,select,button{font:inherit;color:inherit}
input[type=month]{border-radius:12px;padding:7px 12px}
.auth-btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:7px 14px;font-weight:600;font-size:.9rem}
.auth-btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--glass)}
.auth-bar{margin-top:12px;padding:10px 16px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.sync-badge{font-weight:600;color:var(--accent)}
.total{margin:16px 0 14px;padding:22px 24px}
.total small{color:var(--muted);font-size:.95rem}
.total strong{display:block;font-size:clamp(3rem,13vw,6rem);font-weight:800;line-height:1;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.bars{margin:0 0 14px;padding:18px 22px;display:grid;gap:12px}
.bars:empty{display:none}
.bar{display:grid;grid-template-columns:104px 1fr auto;gap:10px;align-items:center;font-size:.92rem}
.track{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--hot));border-radius:6px;transition:width .35s}
.bar span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
form{display:grid;grid-template-columns:2fr 1fr 1.2fr 1fr auto;gap:8px;padding:12px;margin-bottom:6px}
form input,form select{background:var(--surface);border:1px solid var(--glass);border-radius:12px;padding:10px 12px;min-width:0}
button{cursor:pointer}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:10px 20px;font-weight:600;box-shadow:0 6px 18px rgba(15,76,69,.35)}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
h2{font-size:1rem;margin:32px 0 8px;font-weight:600}
.split{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:.95rem}
.split b{font-variant-numeric:tabular-nums;margin-left:6px}
.in{color:var(--accent)}.out{color:var(--hot)}
.tipo{grid-column:1/-1;display:flex;gap:8px}
.tipo label{position:relative}
.tipo input{position:absolute;opacity:0;width:1px;height:1px;padding:0;border:0}
.tipo span{display:block;padding:8px 20px;border-radius:999px;border:1px solid var(--glass);background:var(--surface);cursor:pointer;font-weight:600}
.tipo input:checked+span{background:var(--accent);color:var(--accent-ink)}
.tipo input:focus-visible+span{outline:2px solid var(--hot);outline-offset:2px}
ul{list-style:none;margin:0;padding:6px 20px}
li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li .d{color:var(--muted);font-size:.85rem}
li .v{font-weight:600;font-variant-numeric:tabular-nums}
.del{background:none;border:0;color:var(--muted);font-size:1.2rem;padding:2px 8px;border-radius:6px}
.del:hover{color:var(--hot)}
.empty{color:var(--muted);padding:18px 0}
@media (max-width:640px){form{grid-template-columns:1fr 1fr}#desc,.add{grid-column:1/-1}.bar{grid-template-columns:84px 1fr auto}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.tools button{background:var(--surface);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--glass);border-radius:12px;padding:8px 14px;font-weight:600}
.tools button:hover{border-color:var(--accent)}
.msg{color:var(--muted);font-size:.85rem;margin:6px 2px 0}
.exp-box{background:var(--surface);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--glass);border-radius:18px;padding:12px 14px;margin:0 0 12px;display:grid;gap:10px}
.exp-box[hidden]{display:none}
.exp-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.exp-row label{font-size:.86rem;color:var(--muted)}
.exp-row select,.exp-row input{background:var(--surface);border:1px solid var(--glass);border-radius:10px;padding:7px 10px;min-width:0}
.exp-row input[type=number]{width:92px}
.imp-meses{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.imp-chip{background:var(--surface);border:1px solid var(--glass);border-radius:999px;padding:4px 11px;font-size:.8rem;font-weight:600;color:var(--ink)}
.imp-chip:hover{border-color:var(--accent);color:var(--accent)}
.imp-chip.passado{border-color:rgba(159,179,174,.45)}
.imp-chip.futuro{border-color:rgba(228,87,46,.45)}
.fixo{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--muted);cursor:pointer}
.fixo input{width:18px;height:18px;padding:0;accent-color:var(--accent);cursor:pointer}
.duracao{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--glass)}
.duracao[hidden]{display:none}
.duracao label{font-size:.88rem;color:var(--muted)}
.duracao input[type=number]{width:96px;padding:7px 10px;border-radius:10px;border:1px solid var(--glass);background:var(--surface)}
.tag{font-weight:600;color:var(--accent)}
.fx{background:none;border:0;padding:2px 0;margin-top:2px;color:var(--accent);font-size:.85rem;font-weight:600;text-decoration:underline}
.del.ask{color:var(--hot);font-size:.8rem;font-weight:600}
</style>
</head>
<body>
<main>
<header>
  <h1>Meus gastos</h1>
  <div class="header-controls">
    <button type="button" class="auth-btn" id="bGoogleLogin">Entrar com Google</button>
    <button type="button" class="auth-btn secondary" id="bGoogleLogout" hidden>Sair</button>
    <input type="month" id="mes" aria-label="Mês">
  </div>
</header>

<div class="auth-bar" aria-live="polite">
  <span id="contaStatus">Modo local ativo — entre com o Google para sincronizar no seu Drive.</span>
  <span class="sync-badge" id="syncStatus">Cache local</span>
</div>

<section class="total" aria-live="polite">
  <small>Saldo do mês</small>
  <strong id="total">R$ 0,00</strong>
  <div class="split"><span>Ganhos <b id="ganhos" class="in">R$ 0,00</b></span><span>Gastos <b id="gastos" class="out">R$ 0,00</b></span></div>
</section>

<section class="bars" id="bars" aria-label="Gastos por categoria"></section>

<form id="f">
  <div class="tipo" role="radiogroup" aria-label="Tipo de lançamento">
    <label><input type="radio" name="tipo" value="gasto" checked><span>Gastei</span></label>
    <label><input type="radio" name="tipo" value="ganho"><span>Ganhei</span></label>
  </div>
  <label class="fixo"><input type="checkbox" id="fixo"> Fixo: repete todo mês</label>
  <div class="duracao" id="durBox" hidden>
    <label for="durTipo">Duração:</label>
    <select id="durTipo" aria-label="Tipo de duração">
      <option value="perpetuo">Perpétuo</option>
      <option value="meses">Número de meses</option>
      <option value="anos">Número de anos</option>
    </select>
    <input type="number" id="durQtd" min="1" max="600" step="1" value="12" aria-label="Quantidade de meses ou anos" hidden>
    <span class="msg" id="durResumo" style="margin:0">Repete por tempo indeterminado</span>
  </div>
  <input id="desc" placeholder="O que você comprou?" required maxlength="60" aria-label="Descrição">
  <input id="valor" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="Valor (R$)" required aria-label="Valor">
  <select id="cat" aria-label="Categoria">
    <option>Mercado</option><option>Transporte</option><option>Moradia</option><option>Lazer</option><option>Saúde</option><option>Outros</option>
  </select>
  <input id="data" type="date" required aria-label="Data">
  <button class="add" type="submit" id="bAdd">Adicionar</button>
</form>

<h2>Lançamentos</h2>
<div class="tools">
  <button type="button" id="bCsv">Exportar planilha</button>
  <button type="button" id="bImp">Importar planilha</button>
  <input type="file" id="fCsv" accept=".csv,text/csv" hidden>
  <button type="button" id="bBkp">Salvar backup</button>
  <button type="button" id="bRes">Restaurar backup</button>
  <input type="file" id="fRes" accept=".json,application/json" hidden>
</div>
<div class="exp-box" id="expBox" hidden>
  <div class="exp-row">
    <label for="expModo">Exportar:</label>
    <select id="expModo" aria-label="Modo de exportação">
      <option value="mes">Mês selecionado</option>
      <option value="intervalo-meses">Intervalo de meses</option>
      <option value="intervalo-anos">Intervalo de anos</option>
      <option value="tudo">Todos os lançamentos</option>
    </select>
    <span id="expCamposMeses" class="exp-row" hidden>
      <label for="expMesIni">De</label>
      <input type="month" id="expMesIni" aria-label="Mês inicial">
      <label for="expMesFim">até</label>
      <input type="month" id="expMesFim" aria-label="Mês final">
    </span>
    <span id="expCamposAnos" class="exp-row" hidden>
      <label for="expAnoIni">Ano inicial</label>
      <input type="number" id="expAnoIni" min="1970" max="2100" step="1" aria-label="Ano inicial">
      <label for="expAnoFim">até</label>
      <input type="number" id="expAnoFim" min="1970" max="2100" step="1" aria-label="Ano final">
    </span>
    <button type="button" class="add" id="bCsvConfirmar" style="padding:7px 14px">Baixar CSV</button>
  </div>
  <span class="msg" id="expResumo" style="margin:0"></span>
</div>
<p class="msg" id="statusMsg" role="status" aria-live="polite"></p>
<div class="imp-meses" id="impMeses" aria-label="Meses detectados na importação"></div>
<ul id="lista"></ul>
</main>

<script>
const KEY="meus-gastos-v1";
const GOOGLE_CLIENT_ID="701476095582-oanbqq0re8bdo7ldjo3t0pcrnt4sv3vf.apps.googleusercontent.com";
const DRIVE_SCOPE="https://www.googleapis.com/auth/drive.appdata";
const DRIVE_FILE_NAME="meus-gastos-dados.json";

let gastos=[];
try{gastos=JSON.parse(localStorage.getItem(KEY)||"[]")||[]}catch(e){gastos=[]}
const $=id=>document.getElementById(id);
const brl=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

let tokenClient=null;
let driveAccessToken=null;
let driveFileId=null;
let syncTimer=null;

function atualizarSyncUI(estado,detalhe){
  $("syncStatus").textContent=estado;
  if(detalhe)$("contaStatus").textContent=detalhe;
}

function mesclarGastos(remotos,locais){
  const mapa=new Map();
  (Array.isArray(remotos)?remotos:[]).forEach(item=>{
    if(item&&item.id!=null&&item.data&&item.valor>0)mapa.set(String(item.id),item);
  });
  (Array.isArray(locais)?locais:[]).forEach(item=>{
    if(item&&item.id!=null&&item.data&&item.valor>0&&!mapa.has(String(item.id))){
      mapa.set(String(item.id),item);
    }
  });
  return Array.from(mapa.values());
}

async function driveFetch(url,opcoes={}){
  if(!driveAccessToken)throw new Error("Sem token do Google Drive.");
  const headers=Object.assign({},opcoes.headers||{},{Authorization:"Bearer "+driveAccessToken});
  const resp=await fetch(url,Object.assign({},opcoes,{headers}));
  if(!resp.ok){
    const txt=await resp.text().catch(()=>"");
    throw new Error(`Erro no Google Drive (${resp.status}): ${txt||resp.statusText}`);
  }
  return resp;
}

async function carregarDoDrive(){
  atualizarSyncUI("Sincronizando...","Carregando dados do seu Google Drive...");
  const q=encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const listResp=await driveFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,name,modifiedTime)`);
  const listJson=await listResp.json();
  const arquivo=listJson.files&&listJson.files[0];

  if(arquivo){
    driveFileId=arquivo.id;
    const contentResp=await driveFetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(driveFileId)}?alt=media`);
    const dadosRemotos=await contentResp.json();
    gastos=mesclarGastos(dadosRemotos,gastos);
    try{localStorage.setItem(KEY,JSON.stringify(gastos))}catch(e){}
    render();
    await enviarParaDrive(true);
    atualizarSyncUI("Sincronizado","Conectado ao Google Drive ("+DRIVE_FILE_NAME+").");
  }else{
    driveFileId=null;
    await enviarParaDrive(true);
    atualizarSyncUI("Sincronizado","Novo arquivo criado no seu Google Drive.");
  }
}

async function enviarParaDrive(silencioso=false){
  if(!driveAccessToken)return;
  if(!silencioso)atualizarSyncUI("Salvando no Drive...");
  const payload=JSON.stringify(gastos);
  if(!driveFileId){
    const metadata={name:DRIVE_FILE_NAME,parents:["appDataFolder"],mimeType:"application/json"};
    const form=new FormData();
    form.append("metadata",new Blob([JSON.stringify(metadata)],{type:"application/json"}));
    form.append("file",new Blob([payload],{type:"application/json"}));
    const createResp=await driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{
      method:"POST",
      body:form
    });
    const created=await createResp.json();
    driveFileId=created.id;
  }else{
    await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(driveFileId)}?uploadType=media`,{
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:payload
    });
  }
  atualizarSyncUI("Sincronizado");
}

function agendarSyncDrive(){
  if(!driveAccessToken)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{
    enviarParaDrive(false).catch(err=>{
      atualizarSyncUI("Erro no Drive");
      setStatus(err.message||"Falha ao sincronizar com o Google Drive.");
    });
  },250);
}

async function obterPerfilGoogle(){
  if(!driveAccessToken)return;
  try{
    const resp=await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{
      headers:{Authorization:"Bearer "+driveAccessToken}
    });
    if(!resp.ok)return;
    const perfil=await resp.json();
    const rotulo=perfil.email||perfil.name||"Conta Google";
    $("contaStatus").textContent=`Conectado como ${rotulo}`;
    $("bGoogleLogin").hidden=true;
    $("bGoogleLogout").hidden=false;
  }catch(e){}
}

function iniciarTokenClient(){
  if(!window.google||!window.google.accounts||!window.google.accounts.oauth2)return false;
  if(tokenClient)return true;
  tokenClient=window.google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_CLIENT_ID,
    scope:DRIVE_SCOPE,
    callback:async resp=>{
      if(resp.error){
        setStatus("Não foi possível concluir o login com o Google: "+resp.error);
        return;
      }
      driveAccessToken=resp.access_token;
      $("bGoogleLogin").hidden=true;
      $("bGoogleLogout").hidden=false;
      await obterPerfilGoogle();
      try{
        await carregarDoDrive();
      }catch(err){
        atualizarSyncUI("Erro no Drive");
        setStatus(err.message||"Erro ao acessar o Google Drive.");
      }
    }
  });
  return true;
}

$("bGoogleLogin").addEventListener("click",()=>{
  if(!iniciarTokenClient()){
    setStatus("Carregando serviço de login do Google... tente novamente em 1 segundo.");
    return;
  }
  tokenClient.requestAccessToken({prompt:driveAccessToken?"":"consent"});
});

$("bGoogleLogout").addEventListener("click",()=>{
  const tokenAtual=driveAccessToken;
  driveAccessToken=null;
  driveFileId=null;
  if(tokenAtual&&window.google&&window.google.accounts&&window.google.accounts.oauth2){
    window.google.accounts.oauth2.revoke(tokenAtual,()=>{});
  }
  $("bGoogleLogin").hidden=false;
  $("bGoogleLogout").hidden=true;
  atualizarSyncUI("Cache local","Sessão encerrada — alterações ficam apenas no cache local.");
});

// Consulta a data local atual na hora (YYYY-MM-DD) para evitar datas obsoletas ao deixar a aba aberta
function dataHoje(){
  const d0=new Date();
  return d0.getFullYear()+"-"+String(d0.getMonth()+1).padStart(2,"0")+"-"+String(d0.getDate()).padStart(2,"0");
}

function mesAtual(){
  return dataHoje().slice(0,7);
}

let ultimoDiaConhecido=dataHoje();
let ultimoMesConhecido=mesAtual();
$("data").value=ultimoDiaConhecido;
$("mes").value=ultimoMesConhecido;

function salvar(){
  try{localStorage.setItem(KEY,JSON.stringify(gastos))}catch(e){}
  agendarSyncDrive();
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function setStatus(txt){$("statusMsg").textContent=txt||""}

let pendente=null;
function dataNoMes(d,mes){const [y,m]=mes.split("-").map(Number);const ult=new Date(y,m,0).getDate();return mes+"-"+String(Math.min(+d.slice(8,10),ult)).padStart(2,"0")}

function diffMeses(iniMes,alvoMes){
  const [y1,m1]=iniMes.split("-").map(Number);
  const [y2,m2]=alvoMes.split("-").map(Number);
  return (y2-y1)*12+(m2-m1)+1;
}

function somarMeses(iniMes,qtdMeses){
  const [y1,m1]=iniMes.split("-").map(Number);
  const total=(y1*12+(m1-1))+Math.max(1,qtdMeses)-1;
  const y=Math.floor(total/12);
  const m=(total%12)+1;
  return y+"-"+String(m).padStart(2,"0");
}

function fimPrevisto(g){
  if(!g.fixo)return null;
  const ini=g.data.slice(0,7);
  let limite=null;
  if(g.durTipo==="meses" && g.durQtd>0){
    limite=somarMeses(ini,g.durQtd);
  }else if(g.durTipo==="anos" && g.durQtd>0){
    limite=somarMeses(ini,g.durQtd*12);
  }
  if(g.fim && limite)return g.fim<limite?g.fim:limite;
  return g.fim||limite||null;
}

function atualizarDuracaoUI(){
  const ativo=$("fixo").checked;
  $("durBox").hidden=!ativo;
  if(!ativo)return;
  const tipo=$("durTipo").value;
  const isQtd=tipo==="meses"||tipo==="anos";
  $("durQtd").hidden=!isQtd;
  if(isQtd){
    const max=tipo==="anos"?50:600;
    $("durQtd").max=String(max);
    let qtd=parseInt($("durQtd").value,10);
    if(!Number.isFinite(qtd)||qtd<1)qtd=tipo==="anos"?1:12;
    if(qtd>max)qtd=max;
    $("durQtd").value=String(qtd);
    const totalMeses=tipo==="anos"?qtd*12:qtd;
    const fim=somarMeses(($("data").value||dataHoje()).slice(0,7),totalMeses);
    $("durResumo").textContent=tipo==="anos"
      ?`Repete por ${qtd} ${qtd===1?"ano":"anos"} (${totalMeses} meses, até ${fim.split("-").reverse().join("/")})`
      :`Repete por ${qtd} ${qtd===1?"mês":"meses"} (até ${fim.split("-").reverse().join("/")})`;
  }else{
    $("durResumo").textContent="Repete por tempo indeterminado";
  }
}

$("fixo").addEventListener("change",atualizarDuracaoUI);
$("durTipo").addEventListener("change",atualizarDuracaoUI);
$("durQtd").addEventListener("input",atualizarDuracaoUI);
$("data").addEventListener("change",atualizarDuracaoUI);

function badgeFixo(g,mes){
  const ini=g.data.slice(0,7);
  const parc=diffMeses(ini,mes);
  const fim=fimPrevisto(g);
  const encerradoAqui=g.fim===mes;
  if(g.durTipo==="meses" && g.durQtd>0){
    return `${encerradoAqui?"Fixo, encerrado neste mês":`Fixo ${parc}/${g.durQtd}m`}`;
  }
  if(g.durTipo==="anos" && g.durQtd>0){
    const totalM=g.durQtd*12;
    const anoAtual=Math.min(g.durQtd,Math.ceil(parc/12));
    return `${encerradoAqui?"Fixo, encerrado neste mês":`Fixo ${anoAtual}/${g.durQtd}a (${parc}/${totalM}m)`}`;
  }
  if(fim && fim===mes){
    return "Fixo, último mês";
  }
  return encerradoAqui?"Fixo, último mês":"Fixo";
}

function render(){
  const mes=$("mes").value||mesAtual();
  const itens=gastos.filter(g=>{
    if(!g.fixo)return g.data.startsWith(mes);
    const ini=g.data.slice(0,7);
    if(ini>mes)return false;
    const fim=fimPrevisto(g);
    if(fim && mes>fim)return false;
    return true;
  }).map(g=>({...g,dv:g.fixo?dataNoMes(g.data,mes):g.data})).sort((a,b)=>b.dv.localeCompare(a.dv)||String(b.id).localeCompare(String(a.id)));
  const soma=t=>itens.filter(g=>(g.tipo||"gasto")===t).reduce((s,g)=>s+g.valor,0);
  const ganhos=soma("ganho"),total=soma("gasto"),saldo=ganhos-total;
  $("total").textContent=brl(saldo);
  $("total").style.color=saldo<0?"var(--hot)":"";
  $("ganhos").textContent=brl(ganhos);$("gastos").textContent=brl(total);
  const porCat={};
  itens.filter(g=>(g.tipo||"gasto")==="gasto").forEach(g=>porCat[g.cat]=(porCat[g.cat]||0)+g.valor);
  const cats=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  $("bars").innerHTML=cats.map(([c,v])=>`<div class="bar"><span>${esc(c)}</span><div class="track"><div class="fill" style="width:${total>0?(v/total*100).toFixed(1):0}%"></div></div><span>${brl(v)}</span></div>`).join("");
  $("lista").innerHTML=itens.length?itens.map(g=>`<li><div>${esc(g.desc)}<div class="d">${esc(g.cat)} · ${g.dv.split("-").reverse().join("/")}${g.fixo?` · <span class="tag">${esc(badgeFixo(g,mes))}</span>`:""}</div>${g.fixo?`<button type="button" class="fx" data-id="${g.id}">${g.fim===mes?"Retomar":"Encerrar fixo"}</button>`:""}</div><span class="v ${g.tipo==="ganho"?"in":"out"}">${g.tipo==="ganho"?"+":"−"} ${brl(g.valor)}</span><button class="del${g.fixo&&pendente===String(g.id)?" ask":""}" data-id="${g.id}" aria-label="Excluir ${esc(g.desc)}${g.fixo?" de todos os meses":""}">${g.fixo&&pendente===String(g.id)?"Excluir de todos os meses?":"×"}</button></li>`).join(""):`<li class="empty">Nenhum lançamento neste mês. Adicione o primeiro acima.</li>`;
}

function adicionar(){
  if(!$("f").reportValidity())return;
  const valor=parseFloat(String($("valor").value).replace(",","."));
  const desc=$("desc").value.trim();
  const data=$("data").value;
  if(!desc||!(valor>0)||!data)return;
  const fixo=$("fixo").checked;
  const durTipo=fixo?$("durTipo").value:"perpetuo";
  const durQtd=fixo&&(durTipo==="meses"||durTipo==="anos")?Math.max(1,parseInt($("durQtd").value,10)||1):null;
  gastos.push({id:Date.now()+"-"+Math.random().toString(36).slice(2,6),desc,valor,tipo:document.querySelector("input[name=tipo]:checked").value,cat:$("cat").value,data,fixo,durTipo,durQtd});
  salvar();
  $("mes").value=data.slice(0,7);
  $("desc").value="";$("valor").value="";$("fixo").checked=false;
  atualizarDuracaoUI();
  $("desc").focus();
  pendente=null;
  render();
}
$("bAdd").addEventListener("click",e=>{e.preventDefault();adicionar()});
$("f").addEventListener("submit",e=>{e.preventDefault();adicionar()});
$("lista").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const id=b.dataset.id;const g=gastos.find(x=>String(x.id)===id);if(!g)return;
  if(b.classList.contains("del")){
    if(g.fixo&&pendente!==id){pendente=id;render();return}
    gastos=gastos.filter(x=>String(x.id)!==id);
  }else if(b.classList.contains("fx")){
    const mes=$("mes").value||mesAtual();
    if(g.fim===mes)delete g.fim;else g.fim=mes;
  }
  pendente=null;salvar();render();
});

// Sincroniza data do formulário e mês exibido quando o dia ou mês real muda ao abrir ou retornar à janela
function sincronizarDataReal(forcarMes=false){
  const hojeReal=dataHoje();
  const mesReal=hojeReal.slice(0,7);
  const mudouDia=hojeReal!==ultimoDiaConhecido;
  const mudouMes=mesReal!==ultimoMesConhecido;

  if(mudouDia||forcarMes){
    if(!$("data").value||$("data").value===ultimoDiaConhecido||mudouDia){
      $("data").value=hojeReal;
    }
    ultimoDiaConhecido=hojeReal;
  }

  if(mudouMes||forcarMes){
    if(!$("mes").value||$("mes").value===ultimoMesConhecido||mudouMes){
      $("mes").value=mesReal;
      pendente=null;
    }
    ultimoMesConhecido=mesReal;
    atualizarDuracaoUI();
    render();
  }else if(mudouDia){
    atualizarDuracaoUI();
  }
}

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible")sincronizarDataReal(false);
});
window.addEventListener("focus",()=>sincronizarDataReal(false));

function baixar(nome,conteudo,tipo){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo}));
  a.download=nome;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

// Gera lista ordenada de meses (YYYY-MM) entre mesIni e mesFim inclusive
function listarMesesIntervalo(mesIni,mesFim){
  if(!mesIni||!mesFim)return [];
  let [a,b]=mesIni<=mesFim?[mesIni,mesFim]:[mesFim,mesIni];
  let [y1,m1]=a.split("-").map(Number);
  const [y2,m2]=b.split("-").map(Number);
  const meses=[];
  for(let k=0;k<1200;k++){
    const atual=y1+"-"+String(m1).padStart(2,"0");
    meses.push(atual);
    if(atual===`${y2}-${String(m2).padStart(2,"0")}`)break;
    if(++m1>12){m1=1;y1++}
  }
  return meses;
}

// Gera ocorrências de lançamentos pontuais e recorrentes para um conjunto específico de meses
function ocorrenciasParaMeses(mesesAlvo){
  const listaMeses=Array.from(new Set(mesesAlvo)).sort();
  const out=[];
  listaMeses.forEach(mes=>{
    gastos.forEach(g=>{
      if(!g.fixo){
        if(g.data.startsWith(mes))out.push({...g,dv:g.data,mesRef:mes});
        return;
      }
      const ini=g.data.slice(0,7);
      if(ini>mes)return;
      const fim=fimPrevisto(g);
      if(fim && mes>fim)return;
      out.push({...g,dv:dataNoMes(g.data,mes),mesRef:mes});
    });
  });
  return out.sort((a,b)=>a.dv.localeCompare(b.dv)||String(a.id).localeCompare(String(b.id)));
}

function ocorrencias(){
  const out=[],atual=mesAtual();
  gastos.forEach(g=>{
    if(!g.fixo){out.push({...g,dv:g.data});return}
    const ini=g.data.slice(0,7);let [y,m]=ini.split("-").map(Number);
    const fim=fimPrevisto(g)||(ini>atual?ini:atual);
    for(let k=0;k<600;k++){
      const mes=y+"-"+String(m).padStart(2,"0");if(mes>fim)break;
      out.push({...g,dv:dataNoMes(g.data,mes)});
      if(++m>12){m=1;y++}
    }
  });
  return out.sort((a,b)=>a.dv.localeCompare(b.dv));
}

function atualizarExportacaoUI(){
  const modo=$("expModo").value;
  const mesSel=$("mes").value||mesAtual();
  const anoSel=parseInt(mesSel.slice(0,4),10)||new Date().getFullYear();
  $("expCamposMeses").hidden=modo!=="intervalo-meses";
  $("expCamposAnos").hidden=modo!=="intervalo-anos";
  if(!$("expMesIni").value)$("expMesIni").value=mesSel;
  if(!$("expMesFim").value)$("expMesFim").value=mesSel;
  if(!$("expAnoIni").value)$("expAnoIni").value=String(anoSel);
  if(!$("expAnoFim").value)$("expAnoFim").value=String(anoSel);

  if(modo==="mes"){
    $("expResumo").textContent=`Exporta apenas ${mesSel.split("-").reverse().join("/")} (incluindo recorrências ativas no mês).`;
  }else if(modo==="intervalo-meses"){
    const m1=$("expMesIni").value||mesSel;
    const m2=$("expMesFim").value||m1;
    const qtdM=listarMesesIntervalo(m1,m2).length;
    const [ini,fim]=m1<=m2?[m1,m2]:[m2,m1];
    $("expResumo").textContent=`Exporta ${qtdM} ${qtdM===1?"mês":"meses"}: de ${ini.split("-").reverse().join("/")} até ${fim.split("-").reverse().join("/")}.`;
  }else if(modo==="intervalo-anos"){
    let a1=parseInt($("expAnoIni").value,10)||anoSel;
    let a2=parseInt($("expAnoFim").value,10)||a1;
    if(a1>a2)[a1,a2]=[a2,a1];
    const qtdA=a2-a1+1;
    $("expResumo").textContent=`Exporta ${qtdA} ${qtdA===1?"ano":"anos"} (${a1} a ${a2}, ${qtdA*12} meses completos).`;
  }else{
    $("expResumo").textContent="Exporta todos os lançamentos registrados e ocorrências até o mês atual/previsto.";
  }
}

function parseCsvLinha(linha,sep){
  const res=[];let cur="";let inQuotes=false;
  for(let i=0;i<linha.length;i++){
    const ch=linha[i];
    if(inQuotes){
      if(ch==='"'&&linha[i+1]==='"'){cur+='"';i++}
      else if(ch==='"'){inQuotes=false}
      else{cur+=ch}
    }else{
      if(ch==='"'){inQuotes=true}
      else if(ch===sep){res.push(cur.trim());cur=""}
      else{cur+=ch}
    }
  }
  res.push(cur.trim());
  return res;
}

function normalizarData(raw){
  if(!raw)return null;
  const s=String(raw).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const br=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(br){
    const dia=br[1].padStart(2,"0");
    const mes=br[2].padStart(2,"0");
    return `${br[3]}-${mes}-${dia}`;
  }
  // Suporta datas parciais de mês (MM/AAAA ou AAAA-MM) assumindo dia 01
  const brMes=s.match(/^(\d{1,2})\/(\d{4})$/);
  if(brMes){
    return `${brMes[2]}-${brMes[1].padStart(2,"0")}-01`;
  }
  const isoMes=s.match(/^(\d{4})-(\d{2})$/);
  if(isoMes){
    return `${isoMes[1]}-${isoMes[2]}-01`;
  }
  return null;
}

function normalizarValor(raw){
  if(typeof raw==="number")return Number.isFinite(raw)?Math.abs(raw):NaN;
  if(!raw)return NaN;
  let s=String(raw).replace(/R\$/gi,"").replace(/\s+/g,"").trim();
  if(s.includes(",")&&s.includes(".")){
    s=s.lastIndexOf(",")>s.lastIndexOf(".")?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");
  }else if(s.includes(",")){
    s=s.replace(",",".");
  }
  const n=parseFloat(s);
  return Number.isFinite(n)?Math.abs(n):NaN;
}

function renderChipsMesesImportados(mesesOrdenados){
  const box=$("impMeses");
  const atual=mesAtual();
  if(!mesesOrdenados.length){
    box.innerHTML="";
    return;
  }
  box.innerHTML=mesesOrdenados.map(m=>{
    const rotulo=m.split("-").reverse().join("/");
    const classe=m<atual?"passado":m>atual?"futuro":"";
    const dica=m<atual?" (mês anterior)":m>atual?" (mês futuro)":" (mês atual)";
    return `<button type="button" class="imp-chip ${classe}" data-mes="${m}" title="Ver ${rotulo}${dica}">${rotulo}${m<atual?" ←":m>atual?" →":""}</button>`;
  }).join("");
}

function importarCsvTexto(texto){
  const limpo=texto.replace(/^\ufeff/,"");
  const linhas=limpo.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(linhas.length<2)throw new Error("Planilha vazia ou sem linhas de dados.");
  const sep=linhas[0].split(";").length>=linhas[0].split(",").length?";":",";
  const cab=parseCsvLinha(linhas[0],sep).map(h=>h.toLowerCase());
  const idxData=cab.findIndex(h=>h.includes("data"));
  const idxMesAno=cab.findIndex(h=>h.includes("mês")||h.includes("mes")||h.includes("compet"));
  const idxTipo=cab.findIndex(h=>h.includes("tipo"));
  const idxCat=cab.findIndex(h=>h.includes("categ")||h.includes("cat"));
  const idxDesc=cab.findIndex(h=>h.includes("desc"));
  const idxVal=cab.findIndex(h=>h.includes("valor"));
  const idxFixo=cab.findIndex(h=>h.includes("fixo"));
  const idxDur=cab.findIndex(h=>h.includes("dura"));

  // Agrupa itens importados para reconhecer séries recorrentes em meses para trás ou para frente
  const candidatos=[];
  const mesesDetectados=new Set();

  for(let i=1;i<linhas.length;i++){
    const cols=parseCsvLinha(linhas[i],sep);
    const dataRaw=idxData>=0&&cols[idxData]?cols[idxData]:(idxMesAno>=0?cols[idxMesAno]:cols[0]);
    const data=normalizarData(dataRaw);
    const valBruto=idxVal>=0?cols[idxVal]:cols[4];
    const valor=normalizarValor(valBruto);
    if(!data||!(valor>0))continue;

    let tipo="gasto";
    const tipoStr=(idxTipo>=0?cols[idxTipo]:"").toLowerCase();
    if(tipoStr.includes("ganho")||tipoStr.includes("receita")||tipoStr.includes("entrada")){
      tipo="ganho";
    }else if(tipoStr.includes("gasto")||tipoStr.includes("despesa")||tipoStr.includes("saída")||tipoStr.includes("saida")){
      tipo="gasto";
    }else if(String(valBruto||"").trim().startsWith("+")){
      tipo="ganho";
    }

    const desc=(idxDesc>=0?cols[idxDesc]:cols[3]||"Lançamento importado").trim().slice(0,60)||"Lançamento importado";
    const cat=(idxCat>=0?cols[idxCat]:cols[2]||"Outros").trim()||"Outros";
    const fixoStr=(idxFixo>=0?cols[idxFixo]:"").toLowerCase();
    const fixo=fixoStr==="sim"||fixoStr==="true"||fixoStr==="1"||fixoStr.includes("fixo");

    let durTipo="perpetuo";
    let durQtd=null;
    if(fixo){
      const durStr=(idxDur>=0?cols[idxDur]:"").toLowerCase();
      const numMatch=durStr.match(/(\d+)/);
      if(durStr.includes("ano")&&numMatch){
        durTipo="anos";
        durQtd=Math.max(1,parseInt(numMatch[1],10));
      }else if((durStr.includes("mes")||durStr.includes("mês"))&&numMatch){
        durTipo="meses";
        durQtd=Math.max(1,parseInt(numMatch[1],10));
      }
    }

    mesesDetectados.add(data.slice(0,7));
    candidatos.push({desc,valor,tipo,cat,data,fixo,durTipo,durQtd});
  }

  if(!candidatos.length)throw new Error("Nenhum lançamento válido encontrado na planilha.");

  // Consolida ocorrências repetidas de um mesmo item fixo em meses consecutivos para evitar duplicar recorrências
  const gruposFixos=new Map();
  let adicionados=0;

  candidatos.forEach((item,idx)=>{
    if(!item.fixo){
      gastos.push({
        id:Date.now()+"-"+idx+"-"+Math.random().toString(36).slice(2,6),
        ...item
      });
      adicionados++;
      return;
    }
    const chave=[item.tipo,item.cat.toLowerCase(),item.desc.toLowerCase(),item.valor.toFixed(2),item.durTipo,item.durQtd||""].join("|");
    if(!gruposFixos.has(chave)){
      gruposFixos.set(chave,{...item,meses:new Set([item.data.slice(0,7)])});
    }else{
      const g=gruposFixos.get(chave);
      g.meses.add(item.data.slice(0,7));
      if(item.data<g.data)g.data=item.data;
    }
  });

  gruposFixos.forEach((g,k)=>{
    const ordenados=Array.from(g.meses).sort();
    const primeiroMes=ordenados[0];
    const ultimoMes=ordenados[ordenados.length-1];
    const dataInicial=g.data.startsWith(primeiroMes)?g.data:dataNoMes(g.data,primeiroMes);
    const registro={
      id:Date.now()+"-fx-"+k+"-"+Math.random().toString(36).slice(2,6),
      desc:g.desc,
      valor:g.valor,
      tipo:g.tipo,
      cat:g.cat,
      data:dataInicial,
      fixo:true,
      durTipo:g.durTipo,
      durQtd:g.durQtd
    };
    if(g.durTipo==="perpetuo" && ordenados.length>1 && ultimoMes<mesAtual()){
      registro.fim=ultimoMes;
    }
    gastos.push(registro);
    adicionados++;
  });

  const mesesOrdenados=Array.from(mesesDetectados).sort();
  const atual=mesAtual();
  const paraTras=mesesOrdenados.filter(m=>m<atual);
  const paraFrente=mesesOrdenados.filter(m=>m>atual);

  salvar();
  render();
  renderChipsMesesImportados(mesesOrdenados);

  const partes=[`${adicionados} ${adicionados===1?"lançamento importado":"lançamentos importados"}`];
  if(paraTras.length)partes.push(`${paraTras.length} ${paraTras.length===1?"mês para trás":"meses para trás"} (${paraTras[0].split("-").reverse().join("/")} a ${paraTras[paraTras.length-1].split("-").reverse().join("/")})`);
  if(mesesOrdenados.includes(atual))partes.push(`mês atual (${atual.split("-").reverse().join("/")})`);
  if(paraFrente.length)partes.push(`${paraFrente.length} ${paraFrente.length===1?"mês para frente":"meses para frente"} (${paraFrente[0].split("-").reverse().join("/")} a ${paraFrente[paraFrente.length-1].split("-").reverse().join("/")})`);

  return partes.join(" · ");
}

$("bImp").addEventListener("click",()=>$("fCsv").click());
$("fCsv").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const resumo=importarCsvTexto(String(r.result||""));
      setStatus(`"${f.name}": ${resumo}. Clique em um mês abaixo para visualizar:`);
    }catch(err){
      renderChipsMesesImportados([]);
      setStatus(err.message||"Não foi possível importar a planilha.");
    }
  };
  r.readAsText(f,"utf-8");
  e.target.value="";
});

$("bBkp").addEventListener("click",()=>baixar("backup-gastos-"+dataHoje()+".json",JSON.stringify(gastos,null,1),"application/json"));
$("bRes").addEventListener("click",()=>$("fRes").click());
$("fRes").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d))throw 0;
      const ids=new Set(gastos.map(g=>g.id));
      let added=0;
      d.forEach(g=>{if(g&&g.data&&g.valor>0&&!ids.has(g.id)){gastos.push(g);added++}});
      salvar();render();
      setStatus(`Backup restaurado (${added} ${added===1?"novo item":"novos itens"}).`);
    }catch(err){setStatus("Arquivo de backup inválido.")}
  };
  r.readAsText(f);e.target.value="";
});
atualizarDuracaoUI();
sincronizarDataReal(true);
</script>
